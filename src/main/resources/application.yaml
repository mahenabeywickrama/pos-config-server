spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/mahenabeywickrama/pos-configurations.git
          search-paths: platforms, services
        native:
          search-locations:
            - classpath:/configurations
            - classpath:/configurations/platform
            - classpath:/configurations/services

server:
  port: 9000